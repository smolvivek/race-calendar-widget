<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Deck — F1 &amp; MotoGP Calendar</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0b0d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Race Deck">
<style>
/* Layout concept: a steering-wheel HUD — a central tachometer-style countdown
   dial flanked by angular carbon-panel telemetry readouts for each series. */
:root {
  --bg: #0a0b0d;
  --bg-panel: #15171a;
  --bg-panel-raised: #1c1f23;
  --line: rgba(255,255,255,0.09);
  --line-bright: rgba(255,255,255,0.18);
  --f1: #ff1a1a;
  --f1-dim: #7a1210;
  --moto: #ff7a1a;
  --moto-dim: #7a4012;
  --text: #f3f4f6;
  --text-dim: #9199a3;
  --text-faint: #565c64;
  --warn: #ffcf33;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,26,26,0.07), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: "Titillium Web", "Barlow Semi Condensed", -apple-system, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding-block: 28px 48px;
}

/* ---------- header ---------- */

.flagbar {
  height: 6px;
  background-image: linear-gradient(135deg, var(--text) 25%, transparent 25%, transparent 50%, var(--text) 50%, var(--text) 75%, transparent 75%, transparent);
  background-size: 16px 16px;
  opacity: 0.85;
  margin-bottom: 22px;
  border-radius: 2px;
}

header.top {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 26px;
}

.eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3em;
  color: var(--text-faint);
  text-transform: uppercase;
}

h1 {
  font-family: "Orbitron", "Titillium Web", sans-serif;
  font-size: clamp(28px, 5vw, 42px);
  font-weight: 800;
  letter-spacing: 0.04em;
  margin: 2px 0 0;
  text-wrap: balance;
}

h1 span {
  background: linear-gradient(90deg, var(--f1), var(--moto));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

.clock {
  font-family: "Orbitron", monospace;
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  color: var(--text-dim);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 6px 12px;
  background: var(--bg-panel);
  white-space: nowrap;
}

/* ---------- next-race HUD panels (one per series, equal weight) ---------- */

.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 30px;
}
@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr; }
}

.hud.f1 { --accent: var(--f1); }
.hud.moto { --accent: var(--moto); }

.hud {
  position: relative;
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 7px),
    linear-gradient(180deg, var(--bg-panel-raised), var(--bg-panel));
  border: 1px solid var(--line-bright);
  clip-path: polygon(0 18px, 18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
  padding: clamp(16px, 3vw, 26px);
  display: flex;
  gap: clamp(16px, 3vw, 26px);
  align-items: center;
  flex-wrap: wrap;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
}
.hud:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 10px 28px -14px var(--accent);
}
.hud:active { transform: translateY(0); }

.hud.urgent .dial-fill {
  animation: urgent-pulse 1.4s ease-in-out infinite;
}
@keyframes urgent-pulse {
  0%, 100% { filter: drop-shadow(0 0 6px var(--accent)); }
  50% { filter: drop-shadow(0 0 14px var(--accent)); }
}

.hud::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--accent, var(--f1)), transparent 40%);
  opacity: 0.08;
  pointer-events: none;
}

.dial-box {
  position: relative;
  width: 118px;
  height: 118px;
  flex: none;
}

.dial-box svg { width: 100%; height: 100%; transform: rotate(-90deg); }

.dial-track { fill: none; stroke: var(--line); stroke-width: 7; }
.dial-fill { fill: none; stroke: var(--accent, var(--f1)); stroke-width: 7; stroke-linecap: round;
  filter: drop-shadow(0 0 6px var(--accent, var(--f1))); transition: stroke-dashoffset 0.6s ease; }

.dial-center {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
}

.dial-num { font-family: "Orbitron", monospace; font-size: 22px; font-weight: 700; line-height: 1;
  font-variant-numeric: tabular-nums; }
.dial-unit { font-size: 9px; letter-spacing: 0.14em; color: var(--text-dim); margin-top: 3px; }
.dial-live { font-family: "Orbitron", monospace; font-size: 13px; font-weight: 700; color: var(--accent, var(--f1));
  letter-spacing: 0.06em; }

.hud-info { flex: 1; min-width: 150px; }

.hud-label { font-size: 11px; font-weight: 700; letter-spacing: 0.28em; color: var(--text-faint); margin-bottom: 8px; }

.series-chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: "Orbitron", monospace;
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
  padding: 3px 9px; border-radius: 2px; color: #0a0b0d;
  background: var(--accent, var(--f1));
  margin-bottom: 10px;
}

.hud-race { font-size: clamp(16px, 2.2vw, 21px); font-weight: 700; margin: 0 0 3px; text-wrap: balance; }
.hud-venue { color: var(--text-dim); font-size: 12.5px; margin-bottom: 8px; }
.hud-meta { display: flex; gap: 10px; flex-wrap: wrap; font-family: "Orbitron", monospace;
  font-size: 10.5px; color: var(--text-dim); letter-spacing: 0.03em; }
.hud-meta b { color: var(--text); }

/* "Next session" readout — like a broadcast timing-tower ticker: which
   session is up next and when, in the viewer's own local time. Only shown
   for the handful of races we have an official session-by-session timetable
   for (the immediate next round per series). */
.hud-session {
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  margin-top: 9px; padding-top: 9px; border-top: 1px dotted var(--line);
  font-size: 11.5px;
}
.hud-session .sess-tag {
  font-family: "Orbitron", monospace; font-size: 9px; letter-spacing: 0.08em;
  color: var(--text-faint);
}
.hud-session .sess-name { font-weight: 700; color: var(--accent); }
.hud-session .sess-cd { font-family: "Orbitron", monospace; color: var(--text); }
.hud-session .sess-local { color: var(--text-faint); font-size: 10.5px; }
.hud.urgent .hud-session .sess-cd { animation: cd-pulse 1.4s ease-in-out infinite; }
@keyframes cd-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

.tag {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em;
  border: 1px solid currentColor; border-radius: 2px; padding: 2px 7px;
}
.tag.sprint { color: var(--warn); }
.tag.prov { color: var(--text-dim); }
.tag::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

/* ---------- telemetry panels (series lists) ---------- */

.panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
@media (max-width: 680px) {
  .panels { grid-template-columns: 1fr; }
}

.panel {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px);
  min-width: 0;
}
.panel.f1 { --accent: var(--f1); }
.panel.moto { --accent: var(--moto); }

.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-panel-raised);
}

.panel-head .name {
  font-family: "Orbitron", monospace;
  font-weight: 700; font-size: 13px; letter-spacing: 0.1em;
}
.panel.f1 .panel-head .name { color: var(--f1); }
.panel.moto .panel-head .name { color: var(--moto); }

.panel-head .count { font-size: 11px; color: var(--text-faint); font-family: "Orbitron", monospace; }

.rows { max-height: 420px; overflow-y: auto; }

.race:last-child .row { border-bottom: none; }
.race:nth-child(even) .row { background: rgba(255,255,255,0.015); }

.row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 16px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s ease;
}
.row:hover { background: rgba(255,255,255,0.045) !important; }
.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.row.open { background: rgba(255,255,255,0.06) !important; }

.row .rnd {
  font-family: "Orbitron", monospace; font-size: 10.5px; color: var(--text-faint);
  width: 28px; flex: none;
}
.row .date {
  font-family: "Orbitron", monospace; font-size: 11.5px; color: var(--text-dim);
  width: 56px; flex: none; font-variant-numeric: tabular-nums;
}
.row .gp { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .yr { font-size: 10.5px; color: var(--text-faint); flex: none; }
.row .led { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.row .led.sprint { background: var(--warn); box-shadow: 0 0 5px var(--warn); }
.row .led.prov { background: var(--text-faint); }
.row .led.none { background: transparent; }
.row .chev {
  margin-left: auto; flex: none; color: var(--text-faint); font-size: 13px;
  transition: transform 0.2s ease, color 0.2s ease;
}
.row.open .chev { transform: rotate(90deg); color: var(--accent); }

/* Championship standings rows — flat, no accordion */
.standing-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 16px; border-bottom: 1px solid var(--line); font-size: 12.5px;
}
.standing-row:nth-child(even) { background: rgba(255,255,255,0.015); }
.standing-row:last-child { border-bottom: none; }
.st-pos {
  font-family: "Orbitron", monospace; font-size: 10.5px; color: var(--text-faint);
  width: 20px; flex: none;
}
.st-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: var(--text); }
.st-team { color: var(--text-faint); font-size: 11px; flex: none; max-width: 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-pts { font-family: "Orbitron", monospace; font-weight: 700; color: var(--text); width: 36px; flex: none; text-align: right; }
.tag.champ {
  margin-left: 8px; padding: 1px 6px; font-size: 8.5px; background: var(--f1); color: #0a0b0d;
}

.detail {
  padding: 4px 16px 14px 44px;
  background: rgba(255,255,255,0.025);
  border-bottom: 1px solid var(--line);
  animation: detail-in 0.18s ease;
}
.detail-body { display: flex; gap: 22px; flex-wrap: wrap; }
.detail-facts { flex: 1 1 220px; min-width: 0; }
.detail-name { font-size: 13px; font-weight: 700; margin: 8px 0 8px; color: var(--text); }
.detail-row { display: flex; gap: 10px; padding: 2px 0; align-items: baseline; }
.detail-row span {
  width: 64px; flex: none; font-family: "Orbitron", monospace;
  font-size: 9.5px; letter-spacing: 0.07em; color: var(--text-faint);
}
.detail-row b { color: var(--text-dim); font-weight: 600; font-size: 12px; }
.detail-row b i { color: var(--text-faint); font-style: normal; }
.detail-note {
  margin-top: 6px; padding-top: 6px; border-top: 1px dotted var(--line);
  font-size: 10.5px; line-height: 1.4; color: var(--text-faint); font-style: italic;
  max-width: 440px;
}
.detail-links { display: flex; gap: 16px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
.detail-links a, .ics-btn {
  font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
  color: var(--accent); text-decoration: none;
}
.detail-links a:hover, .ics-btn:hover { text-decoration: underline; }
.ics-btn { font-family: inherit; background: none; border: none; padding: 0; cursor: pointer; }

/* Track-layout card — drawn like a broadcast timing-tower circuit map:
   the real GPS centerline of the track, not a satellite photo or an
   embedded map. Rendered once from embedded path data, no network call. */
.track-map {
  flex: none; width: 168px; margin-top: 8px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.track-map-label {
  align-self: flex-start; font-family: "Orbitron", monospace; font-size: 9px;
  letter-spacing: 0.09em; color: var(--text-faint);
}
.track-map svg { width: 100%; height: auto; display: block; }
.track-map .trk-line { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.track-map .trk-sf { fill: #fff; }
.track-map-km { align-self: flex-start; font-size: 10px; color: var(--text-faint); }
.track-map-km b { color: var(--text-dim); }
.track-missing {
  width: 100%; aspect-ratio: 1.15 / 1; border: 1px dashed var(--line); border-radius: 4px;
  display: flex; align-items: center; justify-content: center; text-align: center;
  font-size: 10px; color: var(--text-faint); padding: 10px; box-sizing: border-box;
}

@keyframes detail-in {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- section headers (standings, etc.) ---------- */

.section-head {
  display: flex; align-items: baseline; gap: 10px; margin: 30px 0 14px;
}
.section-head .eyebrow {
  font-family: "Orbitron", monospace; font-size: 11px; font-weight: 700;
  letter-spacing: 0.18em; color: var(--text-faint);
}
.section-head .rule { flex: 1; height: 1px; background: var(--line); }

/* ---------- race result, shown inside a completed race's own detail panel ---------- */

.detail-result {
  margin-top: 10px; padding-top: 10px; border-top: 1px dotted var(--line);
}
.detail-result .result-label {
  font-family: "Orbitron", monospace; font-size: 9.5px; letter-spacing: 0.07em;
  color: var(--text-faint); margin-bottom: 4px;
}
.podium { list-style: none; margin: 2px 0 0; padding: 0; }
.podium li {
  display: flex; gap: 10px; align-items: baseline; padding: 2px 0; font-size: 12.5px;
}
.podium .pos {
  font-family: "Orbitron", monospace; font-size: 9.5px; color: var(--text-faint);
  width: 20px; flex: none;
}
.podium li:nth-child(1) .pos { color: var(--accent); }
.podium b { color: var(--text-dim); font-weight: 600; }
.podium .team { color: var(--text-faint); font-size: 10.5px; margin-left: 6px; font-weight: 400; }
.sprint-winner { margin-top: 6px; font-size: 11.5px; color: var(--text-faint); }
.sprint-winner b { color: var(--text-dim); }
.cancel-note { margin-top: 10px; padding-top: 10px; border-top: 1px dotted var(--line); font-size: 11.5px; color: var(--text-faint); font-style: italic; }

/* ---------- footer ---------- */

footer {
  margin-top: 28px;
  padding-top: 16px;
  border-top: 1px dashed var(--line);
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  font-size: 11px; color: var(--text-faint); font-family: "Orbitron", monospace;
  letter-spacing: 0.03em;
}
footer a { color: var(--text-dim); }

/* scrollbars */
.rows::-webkit-scrollbar { width: 8px; }
.rows::-webkit-scrollbar-track { background: transparent; }
.rows::-webkit-scrollbar-thumb { background: var(--line-bright); border-radius: 4px; }

@media (prefers-reduced-motion: reduce) {
  .dial-fill, .hud, .row, .chev, .detail { transition: none; animation: none; }
}

/* ---------- start-lights intro ---------- */

.start-lights {
  position: fixed; inset: 0; z-index: 999; background: #000;
  display: flex; align-items: center; justify-content: center; gap: 18px;
  transition: opacity 0.4s ease;
}
.start-lights.hide { opacity: 0; pointer-events: none; }
.start-lights span {
  width: 30px; height: 30px; border-radius: 50%;
  background: #2a0a0a; box-shadow: inset 0 0 6px rgba(0,0,0,0.6);
  transition: background 0.12s ease, box-shadow 0.12s ease;
}
.start-lights span.on { background: #ff1a1a; box-shadow: 0 0 22px #ff1a1a, 0 0 6px #ff1a1a; }

</style>

<body>

<div class="start-lights" id="startLights" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span>
</div>

<div class="wrap">
  <div class="flagbar"></div>
  <header class="top">
    <div>
      <div class="eyebrow">2026 Season</div>
      <h1>RACE <span>DECK</span></h1>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <div class="hero">
    <div class="hud f1" id="hud-f1"></div>
    <div class="hud moto" id="hud-moto"></div>
  </div>

  <div class="panels">
    <div class="panel f1">
      <div class="panel-head"><span class="name">FORMULA 1</span><span class="count" id="f1-count"></span></div>
      <div class="rows" id="f1-rows"></div>
    </div>
    <div class="panel moto">
      <div class="panel-head"><span class="name">MOTOGP</span><span class="count" id="moto-count"></span></div>
      <div class="rows" id="moto-rows"></div>
    </div>
  </div>

  <div class="section-head"><span class="eyebrow">2026 F1 Championship</span><span class="rule"></span></div>
  <div class="panels">
    <div class="panel f1">
      <div class="panel-head"><span class="name">DRIVERS</span><span class="count" id="drivers-count"></span></div>
      <div class="rows standings" id="drivers-standings"></div>
    </div>
    <div class="panel f1">
      <div class="panel-head"><span class="name">CONSTRUCTORS</span><span class="count" id="constructors-count"></span></div>
      <div class="rows standings" id="constructors-standings"></div>
    </div>
  </div>

  <footer>
    <span id="updated"></span>
    <span><a href="https://github.com/smolvivek/race-calendar-widget" target="_blank" rel="noopener">github.com/smolvivek/race-calendar-widget</a> · MIT</span>
  </footer>
</div>

    { "name": "Race", "utc": "2026-11-22T13:00:00Z" }
  ]
};

function nextSession(seriesKey, race, now) {
  const sessions = SESSION_SCHEDULES[raceId(seriesKey, race)];
  if (!sessions) return null;
  const BUFFER_MS = 3 * 60 * 60 * 1000; // treat a session as "live" for up to 3h after it starts
  for (const s of sessions) {
    const t = new Date(s.utc);
    if (now.getTime() < t.getTime() + BUFFER_MS) {
      return { name: s.name, time: t, live: now >= t };
    }
  }
  return null; // every session for this race has already passed
}

function sessionCountdown(t, now) {
  const totalMin = Math.max(0, Math.round((t - now) / 60000));
  if (totalMin >= 1440) return Math.floor(totalMin / 1440) + "d " + Math.floor((totalMin % 1440) / 60) + "h";
  if (totalMin >= 60) return Math.floor(totalMin / 60) + "h " + (totalMin % 60) + "m";
  return totalMin + "m";
}

function getTrackSvg(circuitName) {
  return TRACK_SVGS[CIRCUIT_ALIASES[circuitName] || circuitName] || null;
}

const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

function parseDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d, 0, 0, 0);
}
function fmtDate(iso) {
  const d = parseDate(iso);
  return MONTHS[d.getMonth()] + " " + String(d.getDate()).padStart(2, "0");
}
function fmtRange(startIso, endIso) {
  const s = parseDate(startIso), e = parseDate(endIso);
  if (s.getMonth() === e.getMonth()) return MONTHS[s.getMonth()] + " " + s.getDate() + "–" + e.getDate();
  return MONTHS[s.getMonth()] + " " + s.getDate() + " – " + MONTHS[e.getMonth()] + " " + e.getDate();
}
function shortName(name) { return name.replace(/ Grand Prix$/, ""); }

function flatten(seriesData) {
  const out = [];
  Object.keys(seriesData).forEach((year) => {
    seriesData[year].forEach((race) => out.push({ ...race, year: Number(year) }));
  });
  return out.sort((a, b) => parseDate(a.start) - parseDate(b.start));
}

function upcomingOf(list, now) {
  return list.filter((r) => parseDate(r.end) >= now);
}

function countdownParts(race, now) {
  const start = parseDate(race.start);
  const end = parseDate(race.end);
  const endOfDay = new Date(end.getFullYear(), end.getMonth(), end.getDate(), 23, 59, 59);
  if (now >= start && now <= endOfDay) return { live: true };
  const totalMinutes = Math.max(0, Math.floor((start - now) / 60000));
  return { live: false, days: Math.floor(totalMinutes / 1440), hours: Math.floor((totalMinutes % 1440) / 60) };
}

function raceId(seriesKey, r) { return seriesKey + "-" + r.year + "-" + r.round; }

// Rows are built once (the list itself barely changes) and clicking one
// expands a circuit-detail panel in place. Rebuilding on every clock tick
// would slam any open detail shut every second, so this is separate from
// the per-second tick() below.
function renderRows(container, list, seriesKey) {
  container.innerHTML = "";
  list.forEach((r) => {
    const wrap = document.createElement("div");
    wrap.className = "race";
    wrap.id = raceId(seriesKey, r);
    const ledClass = r.sprint ? "sprint" : r.provisional ? "prov" : "none";
    const specs = getSpecs(r.circuit);
    const laps = specs && specs.laps ? specs.laps[SERIES_SPEC_KEY[seriesKey]] : null;
    const na = '<i>TBD</i>';
    const track = getTrackSvg(r.circuit);
    let resultHtml = "";
    if (r.result) {
      const res = r.result;
      const pod = res.podium && res.podium.length ? res.podium : [res.winner];
      const posLabel = ["P1", "P2", "P3"];
      resultHtml =
        '<div class="detail-result">' +
          '<div class="result-label">RESULT</div>' +
          '<ul class="podium">' +
            pod.slice(0, 3).map((name, i) => {
              const team = i === 0 ? (res.team || teamFor(seriesKey, name)) : teamFor(seriesKey, name);
              return '<li><span class="pos">' + posLabel[i] + '</span><b>' + name + '</b>' +
                (team ? '<span class="team">' + team + '</span>' : '') + '</li>';
            }).join("") +
          '</ul>' +
          (res.sprintWinner ? '<div class="sprint-winner">Sprint winner: <b>' + res.sprintWinner + '</b></div>' : '') +
          (res.note ? '<div class="cancel-note">' + res.note + '</div>' : '') +
        '</div>';
    } else if (r.cancelled) {
      resultHtml = '<div class="detail-result"><div class="cancel-note">' + (r.cancelNote || "Race cancelled.") + '</div></div>';
    }
    let trackHtml;
    if (track) {
      const firstPt = track.d.split(" ");
      const sx = firstPt[1], sy = firstPt[2];
      trackHtml =
        '<div class="track-map">' +
          '<div class="track-map-label">TRACK LAYOUT</div>' +
          '<svg viewBox="0 0 ' + track.vbW + ' ' + track.vbH + '">' +
            '<path class="trk-line" d="' + track.d + '"></path>' +
            '<circle class="trk-sf" cx="' + sx + '" cy="' + sy + '" r="4.5"></circle>' +
          '</svg>' +
          (specs && specs.lengthKm != null ? '<div class="track-map-km"><b>' + specs.lengthKm.toFixed(3) + ' km</b></div>' : '') +
        '</div>';
    } else {
      trackHtml = '<div class="track-map"><div class="track-map-label">TRACK LAYOUT</div><div class="track-missing">Layout not yet available for this circuit</div></div>';
    }
    wrap.innerHTML =
      '<div class="row" role="button" tabindex="0" aria-expanded="false">' +
        '<span class="led ' + ledClass + '"></span>' +
        '<span class="rnd">R' + String(r.round).padStart(2, "0") + '</span>' +
        '<span class="date">' + fmtDate(r.start) + '</span>' +
        '<span class="gp">' + shortName(r.name) + '</span>' +
        '<span class="yr">' + r.year + '</span>' +
        '<span class="chev">›</span>' +
      '</div>' +
      '<div class="detail" hidden>' +
        '<div class="detail-name">' + r.name + '</div>' +
        '<div class="detail-body">' +
          '<div class="detail-facts">' +
            '<div class="detail-row"><span>CIRCUIT</span><b>' + r.circuit + '</b></div>' +
            '<div class="detail-row"><span>LOCATION</span><b>' + r.location + '</b></div>' +
            '<div class="detail-row"><span>LENGTH</span><b>' + (specs && specs.lengthKm != null ? specs.lengthKm.toFixed(3) + ' km' : na) + '</b></div>' +
            '<div class="detail-row"><span>TURNS</span><b>' + (specs && specs.turns != null ? specs.turns : na) + '</b></div>' +
            '<div class="detail-row"><span>LAPS</span><b>' + (laps != null ? laps : na) + '</b></div>' +
            '<div class="detail-row"><span>DATE</span><b>' + fmtRange(r.start, r.end) + ', ' + r.year + '</b></div>' +
            '<div class="detail-row"><span>ROUND</span><b>' + r.round + ' · ' + r.year + ' season</b></div>' +
            (r.sprint ? '<div class="detail-row"><span>FORMAT</span><b>Sprint weekend</b></div>' : '') +
            (r.provisional ? '<div class="detail-row"><span>STATUS</span><b>Provisional date — not yet homologated</b></div>' : '') +
            (specs && specs.note ? '<div class="detail-note">' + specs.note + '</div>' : '') +
            resultHtml +
            '<div class="detail-links">' +
              '<button class="ics-btn" type="button" ' +
                'data-name="' + r.name.replace(/"/g, "&quot;") + '" ' +
                'data-location="' + r.location.replace(/"/g, "&quot;") + '" ' +
                'data-circuit="' + r.circuit.replace(/"/g, "&quot;") + '" ' +
                'data-start="' + r.start + '" data-end="' + r.end + '" ' +
                'data-round="' + r.round + '" data-year="' + r.year + '">+ Add to calendar</button>' +
            '</div>' +
          '</div>' +
          trackHtml +
        '</div>' +
      '</div>';
    container.appendChild(wrap);
  });
}

function toggleRace(wrap, forceOpen) {
  const row = wrap.querySelector(".row");
  const detail = wrap.querySelector(".detail");
  const willOpen = forceOpen !== undefined ? forceOpen : detail.hidden;
  detail.hidden = !willOpen;
  row.classList.toggle("open", willOpen);
  row.setAttribute("aria-expanded", String(willOpen));
}

// Championship standings — a flat, non-expanding list (no accordion; there's
// nothing to drill into per row). Champion already decided this season gets
// a small tag rather than guessing at a visual trophy.
function renderStandings(container, countEl, rows, countLabel) {
  container.innerHTML = "";
  rows.forEach((r) => {
    const row = document.createElement("div");
    row.className = "standing-row";
    row.innerHTML =
      '<span class="st-pos">' + r.pos + '</span>' +
      '<span class="st-name">' + r.name + (r.champion ? '<span class="tag champ">CHAMPION</span>' : '') + '</span>' +
      (r.team ? '<span class="st-team">' + r.team + '</span>' : '') +
      '<span class="st-pts">' + r.points + '</span>';
    container.appendChild(row);
  });
  countEl.textContent = countLabel;
}

// Build a downloadable .ics file for a race weekend (all-day event spanning
// the practice/qualifying/race dates). ICS all-day DTEND is exclusive, so
// it's the day after the last day of the event.
function icsDate(iso) { return iso.replace(/-/g, ""); }
function addOneDay(iso) {
  const d = parseDate(iso);
  d.setDate(d.getDate() + 1);
  return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
}
function icsEscape(s) { return String(s).replace(/([,;])/g, "\\$1"); }
function buildIcs(d) {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const uid = "racedeck-" + d.year + "-r" + d.round + "-" + d.start + "@smolvivek.github.io";
  const desc = d.circuit + " — Round " + d.round + ", " + d.year + " season. Via Race Deck: https://smolvivek.github.io/race-calendar-widget/";
  return [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Race Deck//F1 MotoGP Calendar//EN",
    "CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    "UID:" + uid,
    "DTSTAMP:" + stamp,
    "DTSTART;VALUE=DATE:" + icsDate(d.start),
    "DTEND;VALUE=DATE:" + addOneDay(d.end),
    "SUMMARY:" + icsEscape(d.name),
    "LOCATION:" + icsEscape(d.location),
    "DESCRIPTION:" + icsEscape(desc),
    "END:VEVENT",
    "END:VCALENDAR"
  ].join("\r\n");
}
function downloadIcs(btn) {
  const d = btn.dataset;
  const ics = buildIcs(d);
  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = d.name.replace(/[^\w.-]+/g, "-") + "-" + d.year + ".ics";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function wireRowClicks(container) {
  container.addEventListener("click", (e) => {
    const icsBtn = e.target.closest(".ics-btn");
    if (icsBtn) { downloadIcs(icsBtn); return; }
    const row = e.target.closest(".row");
    if (!row) return;
    toggleRace(row.parentElement);
  });
  container.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    if (e.target.closest(".ics-btn")) return; // native button handles its own Enter/Space
    const row = e.target.closest(".row");
    if (!row) return;
    e.preventDefault();
    toggleRace(row.parentElement);
  });
}

// Jump from a hero dial to its race in the list below and open it there,
// so the two "equal weight" hero cards feel tied to the panels, not static.
function jumpToRace(seriesKey, r) {
  const wrap = document.getElementById(raceId(seriesKey, r));
  if (!wrap) return;
  wrap.scrollIntoView({ behavior: "smooth", block: "nearest" });
  toggleRace(wrap, true);
}

function renderHero(elId, next, now, seriesLabel, seriesKey) {
  const el = document.getElementById(elId);
  if (!next) {
    el.innerHTML = '<div class="hud-info"><div class="hud-label">NEXT ' + seriesLabel.toUpperCase() + '</div><div class="hud-race">No upcoming races in the data file.</div></div>';
    el.onclick = null;
    return;
  }
  const cd = countdownParts(next, now);

  // decorative arc: fraction of a 14-day runway, clamped, just for visual motion
  const R = 74, C = 2 * Math.PI * R;
  let frac = 1;
  if (!cd.live) {
    const totalMin = cd.days * 1440 + cd.hours * 60;
    frac = Math.max(0, Math.min(1, 1 - totalMin / (14 * 1440)));
  }
  const dialCenter = cd.live
    ? '<div class="dial-live">LIVE<br>NOW</div>'
    : '<div class="dial-num">' + cd.days + 'd</div><div class="dial-unit">' + cd.hours + ' HRS</div>';

  const sess = nextSession(seriesKey, next, now);
  const sessionHtml = sess
    ? '<div class="hud-session">' +
        '<span class="sess-tag">NEXT SESSION</span>' +
        '<span class="sess-name">' + sess.name + '</span>' +
        '<span class="sess-cd">' + (sess.live ? "LIVE NOW" : "in " + sessionCountdown(sess.time, now)) + '</span>' +
        '<span class="sess-local">' + sess.time.toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" }) + ' your time</span>' +
      '</div>'
    : '';

  el.innerHTML =
    '<div class="dial-box">' +
      '<svg viewBox="0 0 168 168">' +
        '<circle class="dial-track" cx="84" cy="84" r="' + R + '"/>' +
        '<circle class="dial-fill" cx="84" cy="84" r="' + R + '" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - frac)) + '"/>' +
      '</svg>' +
      '<div class="dial-center">' + dialCenter + '</div>' +
    '</div>' +
    '<div class="hud-info">' +
      '<div class="hud-label">NEXT ' + seriesLabel.toUpperCase() + '</div>' +
      '<div class="hud-race">' + next.name + '</div>' +
      '<div class="hud-venue">' + next.circuit + ' — ' + next.location + '</div>' +
      '<div class="hud-meta">' +
        '<span>ROUND <b>' + next.round + '</b></span>' +
        '<span>' + fmtRange(next.start, next.end) + ', ' + next.year + '</span>' +
        (next.sprint ? '<span class="tag sprint">SPRINT</span>' : '') +
        (next.provisional ? '<span class="tag prov">PROVISIONAL</span>' : '') +
      '</div>' +
      sessionHtml +
    '</div>';
  el.classList.toggle("urgent", cd.live || cd.days === 0);
  el.onclick = () => jumpToRace(seriesKey, next);
}

function updateTabTitle(next) {
  if (!next) { document.title = "Race Deck"; return; }
  const cd = countdownParts(next, new Date());
  const when = cd.live ? "LIVE NOW" : cd.days + "d " + cd.hours + "h";
  document.title = when + " — " + shortName(next.name) + " · Race Deck";
}

function tick() {
  const now = new Date();
  const f1Up = upcomingOf(flatten(DATA.f1), now);
  const motoUp = upcomingOf(flatten(DATA.motogp), now);

  renderHero("hud-f1", f1Up[0], now, "Formula 1", "f1");
  renderHero("hud-moto", motoUp[0], now, "MotoGP", "moto");

  const soonest = [f1Up[0], motoUp[0]]
    .filter(Boolean)
    .sort((a, b) => parseDate(a.start) - parseDate(b.start))[0];
  updateTabTitle(soonest);

  const clock = document.getElementById("clock");
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const ss = String(now.getSeconds()).padStart(2, "0");
  clock.textContent = hh + ":" + mm + ":" + ss + " LOCAL";
}

// Classic F1 start-lights sequence, once, on load — skipped entirely for
// anyone who has reduced motion set.
function playStartLights() {
  const el = document.getElementById("startLights");
  if (!el) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    el.remove();
    return;
  }
  const lights = el.querySelectorAll("span");
  lights.forEach((light, i) => {
    setTimeout(() => light.classList.add("on"), 250 * (i + 1));
  });
  setTimeout(() => lights.forEach((light) => light.classList.remove("on")), 250 * lights.length + 550);
  setTimeout(() => el.classList.add("hide"), 250 * lights.length + 650);
  setTimeout(() => el.remove(), 250 * lights.length + 1100);
}

function init() {
  const now = new Date();
  const f1Season = DATA.f1["2026"].map((r) => ({ ...r, year: 2026 }));
  const motoSeason = DATA.motogp["2026"].map((r) => ({ ...r, year: 2026 }));
  const f1Done = f1Season.filter((r) => parseDate(r.end) < now).length;
  const motoDone = motoSeason.filter((r) => parseDate(r.end) < now).length;

  const f1Rows = document.getElementById("f1-rows");
  const motoRows = document.getElementById("moto-rows");
  renderRows(f1Rows, f1Season, "f1");
  renderRows(motoRows, motoSeason, "moto");
  wireRowClicks(f1Rows);
  wireRowClicks(motoRows);

  document.getElementById("f1-count").textContent = f1Done + " OF " + f1Season.length + " RACED";
  document.getElementById("moto-count").textContent = motoDone + " OF " + motoSeason.length + " RACED";
  document.getElementById("updated").textContent = "DATA UPDATED " + DATA.meta.lastUpdated.toUpperCase();

  renderStandings(document.getElementById("drivers-standings"), document.getElementById("drivers-count"), STANDINGS_2026.drivers, "2026 SEASON");
  renderStandings(document.getElementById("constructors-standings"), document.getElementById("constructors-count"), STANDINGS_2026.constructors, "2026 SEASON");

  tick();
  setInterval(tick, 1000);
  playStartLights();
}

init();
</script>
</body>
</html>
