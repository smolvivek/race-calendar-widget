<style>
/* Layout concept: a steering-wheel HUD — a central tachometer-style countdown
   dial flanked by angular carbon-panel telemetry readouts for each series. */
:root {
  --bg: #0a0b0d;
  --bg-panel: #15171a;
  --bg-panel-raised: #1c1f23;
  --line: rgba(255,255,255,0.09);
  --line-bright: rgba(255,255,255,0.18);
  --f1: #ff1a1a;
  --f1-dim: #7a1210;
  --moto: #ff7a1a;
  --moto-dim: #7a4012;
  --text: #f3f4f6;
  --text-dim: #9199a3;
  --text-faint: #565c64;
  --warn: #ffcf33;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,26,26,0.07), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: "Titillium Web", "Barlow Semi Condensed", -apple-system, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding-block: 28px 48px;
}

/* ---------- header ---------- */

.flagbar {
  height: 6px;
  background-image: linear-gradient(135deg, var(--text) 25%, transparent 25%, transparent 50%, var(--text) 50%, var(--text) 75%, transparent 75%, transparent);
  background-size: 16px 16px;
  opacity: 0.85;
  margin-bottom: 22px;
  border-radius: 2px;
}

header.top {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 26px;
}

.eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3em;
  color: var(--text-faint);
  text-transform: uppercase;
}

h1 {
  font-family: "Orbitron", "Titillium Web", sans-serif;
  font-size: clamp(28px, 5vw, 42px);
  font-weight: 800;
  letter-spacing: 0.04em;
  margin: 2px 0 0;
  text-wrap: balance;
}

h1 span {
  background: linear-gradient(90deg, var(--f1), var(--moto));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

.clock {
  font-family: "Orbitron", monospace;
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  color: var(--text-dim);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 6px 12px;
  background: var(--bg-panel);
  white-space: nowrap;
}

/* ---------- next-race HUD panels (one per series, equal weight) ---------- */

.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 30px;
}
@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr; }
}

.hud.f1 { --accent: var(--f1); }
.hud.moto { --accent: var(--moto); }

.hud {
  position: relative;
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 7px),
    linear-gradient(180deg, var(--bg-panel-raised), var(--bg-panel));
  border: 1px solid var(--line-bright);
  clip-path: polygon(0 18px, 18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
  padding: clamp(16px, 3vw, 26px);
  display: flex;
  gap: clamp(16px, 3vw, 26px);
  align-items: center;
  flex-wrap: wrap;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
}
.hud:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 10px 28px -14px var(--accent);
}
.hud:active { transform: translateY(0); }

.hud::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--accent, var(--f1)), transparent 40%);
  opacity: 0.08;
  pointer-events: none;
}

.dial-box {
  position: relative;
  width: 118px;
  height: 118px;
  flex: none;
}

.dial-box svg { width: 100%; height: 100%; transform: rotate(-90deg); }

.dial-track { fill: none; stroke: var(--line); stroke-width: 7; }
.dial-fill { fill: none; stroke: var(--accent, var(--f1)); stroke-width: 7; stroke-linecap: round;
  filter: drop-shadow(0 0 6px var(--accent, var(--f1))); transition: stroke-dashoffset 0.6s ease; }

.dial-center {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
}

.dial-num { font-family: "Orbitron", monospace; font-size: 22px; font-weight: 700; line-height: 1;
  font-variant-numeric: tabular-nums; }
.dial-unit { font-size: 9px; letter-spacing: 0.14em; color: var(--text-dim); margin-top: 3px; }
.dial-live { font-family: "Orbitron", monospace; font-size: 13px; font-weight: 700; color: var(--accent, var(--f1));
  letter-spacing: 0.06em; }

.hud-info { flex: 1; min-width: 150px; }

.hud-label { font-size: 11px; font-weight: 700; letter-spacing: 0.28em; color: var(--text-faint); margin-bottom: 8px; }

.series-chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: "Orbitron", monospace;
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
  padding: 3px 9px; border-radius: 2px; color: #0a0b0d;
  background: var(--accent, var(--f1));
  margin-bottom: 10px;
}

.hud-race { font-size: clamp(16px, 2.2vw, 21px); font-weight: 700; margin: 0 0 3px; text-wrap: balance; }
.hud-venue { color: var(--text-dim); font-size: 12.5px; margin-bottom: 8px; }
.hud-meta { display: flex; gap: 10px; flex-wrap: wrap; font-family: "Orbitron", monospace;
  font-size: 10.5px; color: var(--text-dim); letter-spacing: 0.03em; }
.hud-meta b { color: var(--text); }

.tag {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em;
  border: 1px solid currentColor; border-radius: 2px; padding: 2px 7px;
}
.tag.sprint { color: var(--warn); }
.tag.prov { color: var(--text-dim); }
.tag::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

/* ---------- telemetry panels (series lists) ---------- */

.panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
@media (max-width: 680px) {
  .panels { grid-template-columns: 1fr; }
}

.panel {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px);
  min-width: 0;
}
.panel.f1 { --accent: var(--f1); }
.panel.moto { --accent: var(--moto); }

.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-panel-raised);
}

.panel-head .name {
  font-family: "Orbitron", monospace;
  font-weight: 700; font-size: 13px; letter-spacing: 0.1em;
}
.panel.f1 .panel-head .name { color: var(--f1); }
.panel.moto .panel-head .name { color: var(--moto); }

.panel-head .count { font-size: 11px; color: var(--text-faint); font-family: "Orbitron", monospace; }

.rows { max-height: 420px; overflow-y: auto; }

.race:last-child .row { border-bottom: none; }
.race:nth-child(even) .row { background: rgba(255,255,255,0.015); }

.row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 16px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s ease;
}
.row:hover { background: rgba(255,255,255,0.045) !important; }
.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.row.open { background: rgba(255,255,255,0.06) !important; }

.row .rnd {
  font-family: "Orbitron", monospace; font-size: 10.5px; color: var(--text-faint);
  width: 28px; flex: none;
}
.row .date {
  font-family: "Orbitron", monospace; font-size: 11.5px; color: var(--text-dim);
  width: 56px; flex: none; font-variant-numeric: tabular-nums;
}
.row .gp { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .yr { font-size: 10.5px; color: var(--text-faint); flex: none; }
.row .led { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.row .led.sprint { background: var(--warn); box-shadow: 0 0 5px var(--warn); }
.row .led.prov { background: var(--text-faint); }
.row .led.none { background: transparent; }
.row .chev {
  margin-left: auto; flex: none; color: var(--text-faint); font-size: 13px;
  transition: transform 0.2s ease, color 0.2s ease;
}
.row.open .chev { transform: rotate(90deg); color: var(--accent); }

.detail {
  padding: 4px 16px 14px 44px;
  background: rgba(255,255,255,0.025);
  border-bottom: 1px solid var(--line);
  animation: detail-in 0.18s ease;
}
.detail-name { font-size: 13px; font-weight: 700; margin: 8px 0 8px; color: var(--text); }
.detail-row { display: flex; gap: 10px; padding: 2px 0; align-items: baseline; }
.detail-row span {
  width: 64px; flex: none; font-family: "Orbitron", monospace;
  font-size: 9.5px; letter-spacing: 0.07em; color: var(--text-faint);
}
.detail-row b { color: var(--text-dim); font-weight: 600; font-size: 12px; }
.detail-links { display: flex; gap: 16px; margin-top: 10px; align-items: center; }
.detail-links a, .map-toggle {
  font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
  color: var(--accent); text-decoration: none;
}
.detail-links a:hover, .map-toggle:hover { text-decoration: underline; }
.map-toggle {
  font-family: inherit; background: none; border: none; padding: 0; cursor: pointer;
}
.map-embed { margin-top: 10px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); max-width: 480px; }
.map-embed iframe { width: 100%; height: 200px; border: 0; display: block; }

@keyframes detail-in {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- footer ---------- */

footer {
  margin-top: 28px;
  padding-top: 16px;
  border-top: 1px dashed var(--line);
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  font-size: 11px; color: var(--text-faint); font-family: "Orbitron", monospace;
  letter-spacing: 0.03em;
}
footer a { color: var(--text-dim); }

/* scrollbars */
.rows::-webkit-scrollbar { width: 8px; }
.rows::-webkit-scrollbar-track { background: transparent; }
.rows::-webkit-scrollbar-thumb { background: var(--line-bright); border-radius: 4px; }

@media (prefers-reduced-motion: reduce) {
  .dial-fill, .hud, .row, .chev, .detail { transition: none; animation: none; }
}
</style>

      { "round": 17, "name": "Grande Prémio de Portugal",       "location": "Portimão, Portugal",        "circuit": "Autódromo Internacional do Algarve",           "start": "2027-10-01", "end": "2027-10-03", "provisional": false },
      { "round": 18, "name": "Japanese Grand Prix",              "location": "Motegi, Japan",             "circuit": "Mobility Resort Motegi",                       "start": "2027-10-15", "end": "2027-10-17", "provisional": false },
      { "round": 19, "name": "Malaysian Grand Prix",             "location": "Sepang, Malaysia",          "circuit": "Petronas Sepang International Circuit",       "start": "2027-10-22", "end": "2027-10-24", "provisional": false },
      { "round": 20, "name": "Pertamina Grand Prix of Indonesia", "location": "Mandalika, Indonesia",     "circuit": "Pertamina Mandalika International Circuit",   "start": "2027-10-29", "end": "2027-10-31", "provisional": false },
      { "round": 21, "name": "Australian Grand Prix",            "location": "Adelaide, Australia",      "circuit": "Adelaide Street Circuit",                      "start": "2027-11-12", "end": "2027-11-14", "provisional": true  },
      { "round": 22, "name": "Comunitat Valenciana Grand Prix",  "location": "Cheste, Spain",             "circuit": "Circuit Ricardo Tormo",                        "start": "2027-11-26", "end": "2027-11-28", "provisional": false }
    ]
  }
};

const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

function parseDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d, 0, 0, 0);
}
function fmtDate(iso) {
  const d = parseDate(iso);
  return MONTHS[d.getMonth()] + " " + String(d.getDate()).padStart(2, "0");
}
function fmtRange(startIso, endIso) {
  const s = parseDate(startIso), e = parseDate(endIso);
  if (s.getMonth() === e.getMonth()) return MONTHS[s.getMonth()] + " " + s.getDate() + "–" + e.getDate();
  return MONTHS[s.getMonth()] + " " + s.getDate() + " – " + MONTHS[e.getMonth()] + " " + e.getDate();
}
function shortName(name) { return name.replace(/ Grand Prix$/, ""); }

function flatten(seriesData) {
  const out = [];
  Object.keys(seriesData).forEach((year) => {
    seriesData[year].forEach((race) => out.push({ ...race, year: Number(year) }));
  });
  return out.sort((a, b) => parseDate(a.start) - parseDate(b.start));
}

function upcomingOf(list, now) {
  return list.filter((r) => parseDate(r.end) >= now);
}

function countdownParts(race, now) {
  const start = parseDate(race.start);
  const end = parseDate(race.end);
  const endOfDay = new Date(end.getFullYear(), end.getMonth(), end.getDate(), 23, 59, 59);
  if (now >= start && now <= endOfDay) return { live: true };
  const totalMinutes = Math.max(0, Math.floor((start - now) / 60000));
  return { live: false, days: Math.floor(totalMinutes / 1440), hours: Math.floor((totalMinutes % 1440) / 60) };
}

function raceId(seriesKey, r) { return seriesKey + "-" + r.year + "-" + r.round; }

// Rows are built once (the list itself barely changes) and clicking one
// expands a circuit-detail panel in place. Rebuilding on every clock tick
// would slam any open detail shut every second, so this is separate from
// the per-second tick() below.
function renderRows(container, list, seriesKey) {
  container.innerHTML = "";
  list.forEach((r) => {
    const wrap = document.createElement("div");
    wrap.className = "race";
    wrap.id = raceId(seriesKey, r);
    const ledClass = r.sprint ? "sprint" : r.provisional ? "prov" : "none";
    const circuitQuery = encodeURIComponent(r.circuit + " circuit");
    const mapQuery = encodeURIComponent(r.circuit + ", " + r.location);
    wrap.innerHTML =
      '<div class="row" role="button" tabindex="0" aria-expanded="false">' +
        '<span class="led ' + ledClass + '"></span>' +
        '<span class="rnd">R' + String(r.round).padStart(2, "0") + '</span>' +
        '<span class="date">' + fmtDate(r.start) + '</span>' +
        '<span class="gp">' + shortName(r.name) + '</span>' +
        '<span class="yr">' + r.year + '</span>' +
        '<span class="chev">›</span>' +
      '</div>' +
      '<div class="detail" hidden>' +
        '<div class="detail-name">' + r.name + '</div>' +
        '<div class="detail-row"><span>CIRCUIT</span><b>' + r.circuit + '</b></div>' +
        '<div class="detail-row"><span>LOCATION</span><b>' + r.location + '</b></div>' +
        '<div class="detail-row"><span>DATE</span><b>' + fmtRange(r.start, r.end) + ', ' + r.year + '</b></div>' +
        '<div class="detail-row"><span>ROUND</span><b>' + r.round + ' · ' + r.year + ' season</b></div>' +
        (r.sprint ? '<div class="detail-row"><span>FORMAT</span><b>Sprint weekend</b></div>' : '') +
        (r.provisional ? '<div class="detail-row"><span>STATUS</span><b>Provisional date — not yet homologated</b></div>' : '') +
        '<div class="detail-links">' +
          '<a href="https://en.wikipedia.org/w/index.php?search=' + circuitQuery + '" target="_blank" rel="noopener">Circuit info ↗</a>' +
          '<button class="map-toggle" type="button" data-q="' + mapQuery + '">Show track location ▾</button>' +
        '</div>' +
        '<div class="map-embed" hidden></div>' +
      '</div>';
    container.appendChild(wrap);
  });
}

function toggleRace(wrap, forceOpen) {
  const row = wrap.querySelector(".row");
  const detail = wrap.querySelector(".detail");
  const willOpen = forceOpen !== undefined ? forceOpen : detail.hidden;
  detail.hidden = !willOpen;
  row.classList.toggle("open", willOpen);
  row.setAttribute("aria-expanded", String(willOpen));
}

function toggleMap(btn) {
  const embed = btn.closest(".detail").querySelector(".map-embed");
  const willOpen = embed.hidden;
  embed.hidden = !willOpen;
  if (willOpen && !embed.dataset.loaded) {
    embed.innerHTML = '<iframe src="https://www.google.com/maps?q=' + btn.dataset.q + '&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>';
    embed.dataset.loaded = "1";
  }
  btn.textContent = willOpen ? "Hide track location ▴" : "Show track location ▾";
}

function wireRowClicks(container) {
  container.addEventListener("click", (e) => {
    const mapBtn = e.target.closest(".map-toggle");
    if (mapBtn) { toggleMap(mapBtn); return; }
    const row = e.target.closest(".row");
    if (!row) return;
    toggleRace(row.parentElement);
  });
  container.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    if (e.target.closest(".map-toggle")) return; // native button handles its own Enter/Space
    const row = e.target.closest(".row");
    if (!row) return;
    e.preventDefault();
    toggleRace(row.parentElement);
  });
}

// Jump from a hero dial to its race in the list below and open it there,
// so the two "equal weight" hero cards feel tied to the panels, not static.
function jumpToRace(seriesKey, r) {
  const wrap = document.getElementById(raceId(seriesKey, r));
  if (!wrap) return;
  wrap.scrollIntoView({ behavior: "smooth", block: "nearest" });
  toggleRace(wrap, true);
}

function renderHero(elId, next, now, seriesLabel, seriesKey) {
  const el = document.getElementById(elId);
  if (!next) {
    el.innerHTML = '<div class="hud-info"><div class="hud-label">NEXT ' + seriesLabel.toUpperCase() + '</div><div class="hud-race">No upcoming races in the data file.</div></div>';
    el.onclick = null;
    return;
  }
  const cd = countdownParts(next, now);

  // decorative arc: fraction of a 14-day runway, clamped, just for visual motion
  const R = 74, C = 2 * Math.PI * R;
  let frac = 1;
  if (!cd.live) {
    const totalMin = cd.days * 1440 + cd.hours * 60;
    frac = Math.max(0, Math.min(1, 1 - totalMin / (14 * 1440)));
  }
  const dialCenter = cd.live
    ? '<div class="dial-live">LIVE<br>NOW</div>'
    : '<div class="dial-num">' + cd.days + 'd</div><div class="dial-unit">' + cd.hours + ' HRS</div>';

  el.innerHTML =
    '<div class="dial-box">' +
      '<svg viewBox="0 0 168 168">' +
        '<circle class="dial-track" cx="84" cy="84" r="' + R + '"/>' +
        '<circle class="dial-fill" cx="84" cy="84" r="' + R + '" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - frac)) + '"/>' +
      '</svg>' +
      '<div class="dial-center">' + dialCenter + '</div>' +
    '</div>' +
    '<div class="hud-info">' +
      '<div class="hud-label">NEXT ' + seriesLabel.toUpperCase() + '</div>' +
      '<div class="hud-race">' + next.name + '</div>' +
      '<div class="hud-venue">' + next.circuit + ' — ' + next.location + '</div>' +
      '<div class="hud-meta">' +
        '<span>ROUND <b>' + next.round + '</b></span>' +
        '<span>' + fmtRange(next.start, next.end) + ', ' + next.year + '</span>' +
        (next.sprint ? '<span class="tag sprint">SPRINT</span>' : '') +
        (next.provisional ? '<span class="tag prov">PROVISIONAL</span>' : '') +
      '</div>' +
    '</div>';
  el.onclick = () => jumpToRace(seriesKey, next);
}

function tick() {
  const now = new Date();
  const f1Up = upcomingOf(flatten(DATA.f1), now);
  const motoUp = upcomingOf(flatten(DATA.motogp), now);

  renderHero("hud-f1", f1Up[0], now, "Formula 1", "f1");
  renderHero("hud-moto", motoUp[0], now, "MotoGP", "moto");

  const clock = document.getElementById("clock");
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const ss = String(now.getSeconds()).padStart(2, "0");
  clock.textContent = hh + ":" + mm + ":" + ss + " LOCAL";
}

function init() {
  const now = new Date();
  const f1Up = upcomingOf(flatten(DATA.f1), now);
  const motoUp = upcomingOf(flatten(DATA.motogp), now);

  const f1Rows = document.getElementById("f1-rows");
  const motoRows = document.getElementById("moto-rows");
  renderRows(f1Rows, f1Up, "f1");
  renderRows(motoRows, motoUp, "moto");
  wireRowClicks(f1Rows);
  wireRowClicks(motoRows);

  document.getElementById("f1-count").textContent = f1Up.length + " ROUNDS LEFT";
  document.getElementById("moto-count").textContent = motoUp.length + " ROUNDS LEFT";
  document.getElementById("updated").textContent = "DATA UPDATED " + DATA.meta.lastUpdated.toUpperCase();

  tick();
  setInterval(tick, 1000);
}

init();
</script>
